<script>
const accent='#39d1cb',ink='#f4f4f5',muted='#b1b5ba',line='#36393d',faint='#121416',red='#ff827d',amber='#f5c65b',green='#77d7a7',surface='#1c1e20';

const rule=(x,y,x2,y2,c=line,dash='')=>'<line x1="'+x+'" y1="'+y+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-dasharray="'+dash+'"/>';

 let y=442, end=y+rows*54;

 if(open)w.parts.forEach((p,i)=>{const [name,qty,need,event,status]=p,c=status==='risk'?red:status==='attention'?amber:green,yn=y+27,from=calendarX(need),to=event===null?null:calendarX(event);

 else graphics+=diamond(from,yn,accent)+txt(from+14,yn+5,'Дата поставки уточняется',13,700,amber);

 })
 }

const routeStack=[];
let importStep='choose', scale='week';
function importedCalendar(){
 const step={day:42,week:24,month:14}[scale];
 const ticks=scale==='day'?Array.from({length:40},(_,i)=>7+i):scale==='week'?[7,14,21,28,35,42]:[7,31];
 const axis=ticks.map(n=>'<span style="left:'+((n-7)*step+4)+'px">'+(scale==='month'?(n===7?'Сентябрь':'Октябрь'):date(n))+'</span>').join('');
 const lanes=works.map(w=>'<div class="lane"><button data-act="work-'+w.id+'" aria-label="Подробнее: '+w.name+'" style="left:'+((w.start-7)*step)+'px;width:'+((w.end-w.start+1)*step)+'px">'+w.name+'</button></div>').join('');
 const buttons=[['day','День'],['week','Неделя'],['month','Месяц']].map(([k,l])=>'<button data-act="scale-'+k+'" aria-pressed="'+(k===scale)+'">'+l+'</button>').join('');
 return '<h2>График СМР</h2><div class="btnline">Масштаб '+buttons+'</div><div class="timeline"><div style="min-width:'+40*step+'px"><div class="axis">'+axis+'</div>'+lanes+'</div></div>';
}
function visit(next,trigger){
 routeStack.push({screen,trigger,scrollX:document.querySelector('main').scrollLeft,scrollY:window.scrollY});

}

}

let screen=location.hash==='#graph'?'board':'login';let importTimer;
function render(){
 document.body.dataset.screen=screen;
 if(screen==='imports'){document.querySelector('main').innerHTML=importView();return}

function focusAction(id){
 const main=document.querySelector('main');
 const target=main.querySelector('[data-act="'+id+'"]')||main.querySelector('[data-act]');
 target?.focus({preventScroll:true});
}
function run(id){
 let restore;
 if(id==='back'){
   restore=routeStack.pop();
   screen=restore?.screen||'board';
 }else if(id==='enter'||id==='return-board'||id==='exit'){
   clearTimeout(importTimer);
   routeStack.length=0;
   screen=id==='exit'?'login':'board';
   if(id==='enter'){filter='all';expanded=new Set(['cols'])}
 }else if(id==='imports'){
   importStep='choose';screen='imports';
 }else if(id.startsWith('scale-')){scale=id.slice(6)}else if(id==='process-example'){
   importStep='processing';
   importTimer=setTimeout(()=>{
     if(screen==='imports'&&importStep==='processing'){importStep='result';render();focusAction('work-slab')}
   },650);
 }else if(id==='spec'){visit('spec',id)}
 else if(id.startsWith('filter-'))filter=id.slice(7);
 else if(id.startsWith('toggle-')){
   const k=id.slice(7);
   if(expanded.has(k))expanded.delete(k);else expanded.add(k);
 }else if(id.startsWith('work-')){
   selected=works.find(w=>w.id===id.slice(5));
   visit('work',id);
 }else if(id==='risk-detail'||id.startsWith('part-')){
   const [k,i]=id==='risk-detail'?['cols',0]:id.slice(5).split('-');
   selected=works.find(w=>w.id===k);part=selected.parts[i];visit('detail',id);
 }
 render();
 if(restore){
   document.querySelector('main').scrollLeft=restore.scrollX;
   window.scrollTo(0,restore.scrollY);
 }else if(!id.startsWith('filter-')&&!id.startsWith('toggle-')){
   document.querySelector('main').scrollLeft=0;window.scrollTo(0,0);
 }
 focusAction(restore?.trigger||(['detail','spec','work'].includes(screen)?'back':id));
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-act]');if(g)run(g.dataset.act)});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&routeStack.length){run('back');return}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-act]')){e.preventDefault();run(e.target.dataset.act)}
});
window.addEventListener('resize',render);render();
</script></body></html>
